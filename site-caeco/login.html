<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CAECO</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    <meta name="description" content="Connectez-vous à votre compte CAECO pour accéder à vos services.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E2233'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Arial,Helvetica,sans-serif' fill='%23AED8F1' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    <meta property="og:title" content="Connexion - CAECO">
    <meta property="og:description" content="Connectez-vous à votre compte CAECO pour accéder à vos services.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/og-image.png">
    <meta property="og:locale" content="fr_HT">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>

<!-- Le header est chargé automatiquement depuis base.html par js/main.js -->
<main>

    <!-- CONNEXION -->
    <section class="container login-section">
        <h2>Connexion à votre compte</h2>
        <p>Accédez à votre espace CAECO pour suivre vos demandes et gérer vos services.</p>

        <p id="login-error" class="form-error" style="display:none;"></p>

        <form action="/login" method="post" class="form login-form">
            <label for="login-email">Email :</label>
            <input type="email" id="login-email" name="email" placeholder="Votre email ici" required autocomplete="username">

            <label for="login-password">Mot de passe :</label>
            <input type="password" id="login-password" name="password" placeholder="Votre mot de passe" required autocomplete="current-password">

            <div>
                <input type="checkbox" id="login-remember" name="remember">
                <label for="login-remember">Se souvenir de moi</label>
            </div>

            <button type="submit">Se connecter</button>

            <p class="form-links">
                <a href="forgot-password.html">Mot de passe oublié ?</a>
            </p>
        </form>

        <div class="signup-prompt">
            <p>Vous n'avez pas encore de compte ?</p>
            <a href="register.html" class="btn">Créer un compte</a>
        </div>
    </section>

</main>

<!-- Le footer est chargé automatiquement depuis base.html par js/main.js -->
</body>
</html>
