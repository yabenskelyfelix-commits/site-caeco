<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - CAECO</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    <meta name="description" content="Créez votre compte CAECO pour accéder à tous nos services.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E2233'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Arial,Helvetica,sans-serif' fill='%23AED8F1' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    <meta property="og:title" content="Créer un compte - CAECO">
    <meta property="og:description" content="Créez votre compte CAECO pour accéder à tous nos services.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/og-image.png">
    <meta property="og:locale" content="fr_HT">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>

<!-- Le header est chargé automatiquement depuis base.html par js/main.js -->
<main>

    <!-- CREATION DE COMPTE -->
    <section class="container login-section">
        <h2>Créer un compte</h2>
        <p>Inscrivez-vous pour accéder à vos services CAECO et suivre vos demandes.</p>

        <p id="register-error" class="form-error" style="display:none;"></p>

        <form action="/register" method="post" class="form register-form">
            <label for="register-prenom">Prénom :</label>
            <input type="text" id="register-prenom" name="prenom" placeholder="Votre prénom" required autocomplete="given-name">

            <label for="register-nom">Nom :</label>
            <input type="text" id="register-nom" name="nom" placeholder="Votre nom" required autocomplete="family-name">

            <label for="register-email">Email :</label>
            <input type="email" id="register-email" name="email" placeholder="Votre email ici" required autocomplete="username">

            <label for="register-telephone">Téléphone :</label>
            <input type="tel" id="register-telephone" name="telephone" placeholder="Votre numéro de téléphone" autocomplete="tel">

            <label for="register-password">Mot de passe :</label>
            <input type="password" id="register-password" name="password" placeholder="Choisissez un mot de passe" required autocomplete="new-password" minlength="8">

            <label for="register-password-confirm">Confirmer le mot de passe :</label>
            <input type="password" id="register-password-confirm" name="password_confirm" placeholder="Confirmez votre mot de passe" required autocomplete="new-password" minlength="8">

            <div>
                <input type="checkbox" id="register-terms" name="terms" required>
                <label for="register-terms">J'accepte les termes et conditions</label>
            </div>

            <button type="submit">Créer mon compte</button>

            <p class="form-links">
                Vous avez déjà un compte ? <a href="login.html">Connectez-vous</a>
            </p>
        </form>
    </section>

</main>

<!-- Le footer est chargé automatiquement depuis base.html par js/main.js -->
</body>
</html>
