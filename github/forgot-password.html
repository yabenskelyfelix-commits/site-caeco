    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E2233'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Arial,Helvetica,sans-serif' fill='%23AED8F1' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

<body>

<!-- Le header est chargé automatiquement depuis base.html par js/main.js -->
<main>

    <!-- MOT DE PASSE OUBLIE -->
    <section class="container login-section">
        <h2>Mot de passe oublié</h2>
        <p>Saisissez l'adresse email associée à votre compte. Nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>

        <form action="/forgot-password" method="post" class="form login-form">
            <label for="forgot-email">Email :</label>
            <input type="email" id="forgot-email" name="email" placeholder="Votre email ici" required autocomplete="username">

            <button type="submit">Envoyer le lien de réinitialisation</button>

            <p class="form-links">
                <a href="login.html">Retour à la connexion</a>
            </p>
        </form>
    </section>

</main>

<!-- Le footer est chargé automatiquement depuis base.html par js/main.js -->
</body>
</html>
